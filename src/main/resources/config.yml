# RegionRental Configuration
# Complete configuration file for all features

# ============================================
# GENERAL SETTINGS
# ============================================
general:
  # Plugin prefix for all messages
  prefix: '&8[&6RegionRental&8]&r '
  
  # Enable debug mode for troubleshooting
  debug: false
  
  # How often to check for expired rentals (in minutes)
  expiration-check-interval: 1
  
  # Automatic save interval (in minutes)
  auto-save-interval: 5
  
  # Maximum number of pages to show in storage GUI
  max-storage-pages: 10

# ============================================
# COMMAND SETTINGS
# ============================================
commands:
  # Custom command prefix (default: "rr")
  # All commands will use this prefix: /{prefix}info, /{prefix}extend, etc.
  # Examples: "rr" → /rrinfo, "rental" → /rentalinfo, "rent" → /rentinfo
  #
  # Validation rules:
  #   - Lowercase letters and numbers only (a-z, 0-9)
  #   - Length: 2-10 characters
  #   - Invalid prefixes will default to "rr"
  #
  # Conflict handling:
  #   - If custom prefix conflicts: automatically falls back to "rr"
  #   - If "rr" also conflicts: uses "rr1", "rr2", etc.
  #
  # NOTE: Changing prefix requires server restart
  prefix: 'rr'

# ============================================
# ECONOMY SETTINGS
# ============================================
economy:
  # Enable economy features
  enabled: true
  
  # Default rental price
  default-price: 100.0
  
  # Currency format for display
  currency-format: '$%.2f'
  
  # Refund money when admin resets a rental
  refund-on-reset: false
  
  # Refund percentage on early termination (0-100)
  refund-percentage: 0

# ============================================
# DURATION SETTINGS
# ============================================
durations:
  # Default rental duration in days
  default-days: 7
  
  # Available duration options for players
  available-durations:
    - 1
    - 3
    - 7
    - 14
    - 30
  
  # Minimum rental duration (days)
  min-duration: 1
  
  # Maximum rental duration (days)
  max-duration: 90
  
  # Allow custom durations via command
  allow-custom-duration: true
  
  # Time format for duration commands
  # Supports: days, hours, minutes, seconds
  # Short forms: d, h, m, s
  time-format-help: 'Use format: 2 days 3 hours 30 minutes or 2d 3h 30m'

# ============================================
# EXTENSION SETTINGS
# ============================================
extension:
  # Enable rental extensions
  enabled: true

  # Default extension duration in days
  extension-days: 7

  # Price multiplier for extensions (1.0 = same as rental price)
  price-multiplier: 1.0

  # Maximum number of extensions per rental
  max-extensions: 10

  # Minimum time before expiry to allow extension (hours)
  min-time-before-extension: 0

  # Maximum time before expiry to allow extension (hours)
  # Set to -1 for no limit
  max-time-before-extension: -1

  # Refund extension costs when admin resets duration to default
  # Only applies to /rrduration reset command
  refund-on-duration-reset: true

# ============================================
# DURATION COMMAND SETTINGS
# ============================================
duration:
  # Refund players proportionally when time is removed via /rrduration remove
  refund-on-time-removal: true

  # Charge players when admin adds time via /rrduration add <region> <time> --charge
  # If false, admin additions are always free
  charge-for-add: false

  # Bypass extension limits for charged admin additions
  # When true, time added with --charge flag doesn't count toward extension limit
  add-bypass-extension-limit: true

  # Price per day for charged admin additions
  # If 0, uses extension pricing (calculated from region price and duration)
  # If > 0, uses this fixed price per day
  add-price-per-day: 0.0

# ============================================
# RENTAL LIMITS
# ============================================
limits:
  # Maximum rentals per player
  max-rentals-per-player: 3
  
  # Override limits by permission
  # Format: permission: limit
  permission-limits:
    'regionrental.vip': 5
    'regionrental.premium': 10
    'regionrental.unlimited': -1
  
  # Cooldown between rentals (seconds)
  rental-cooldown: 0

# ============================================
# MEMBER MANAGEMENT SETTINGS
# ============================================
members:
  # Enable member management feature
  enabled: true

  # Maximum members per rental (-1 for unlimited)
  max-members: 5

# ============================================
# SIGN SETTINGS
# ============================================
signs:
  # Format for available signs (4 lines max)
  available-format:
    - '&2[AVAILABLE]'
    - '&6{region}'
    - '&e{price}'
    - '&7{duration} days'
  
  # Format for rented signs (4 lines max)
  rented-format:
    - '&c[RENTED]'
    - '&6{region}'
    - '&e{owner}'
    - '&7Exp: {expires}'
  
  # Format for expiring soon signs
  expiring-format:
    - '&6[EXPIRING]'
    - '&6{region}'
    - '&e{owner}'
    - '&c{hours}h left'
  
  # Protect rental signs from being broken
  protect-signs: true
  
  # Allow breaking signs with permission
  allow-break-with-permission: true
  
  # Update sign interval (seconds)
  update-interval: 30
  
  # Show expiring warning on signs (hours before expiry)
  expiring-threshold: 24

# ============================================
# STORAGE SETTINGS
# ============================================
storage:
  # Enable item storage when rental expires
  enabled: true

  # Store items from these container types
  store-from-containers: true

  # Store player-placed blocks (blocks different from schematic)
  # Requires block restoration to be enabled
  store-player-blocks: true

  # Blocks to exclude from player block storage (too common/cheap)
  # These blocks will not be stored even if placed by players
  block-blacklist:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - DIRT
    - GRASS_BLOCK
    - STONE
    - COBBLESTONE
    - GRAVEL
    - SAND
    - SANDSTONE
    - WATER
    - LAVA

  # Container types to scan
  container-types:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - HOPPER
    - DROPPER
    - DISPENSER
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - BREWING_STAND
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
  
  # Maximum storage time before auto-deletion (days)
  # Set to -1 to never delete
  max-storage-time: 30
  
  # Items per page in retrieval GUI
  items-per-page: 45

# ============================================
# BLOCK RESTORATION SETTINGS (WorldEdit)
# ============================================
restoration:
  # Enable block restoration when rental expires
  # Requires WorldEdit to be installed
  enabled: true

  # Automatically delete schematic files after restoration
  # If false, schematics are kept for manual restoration
  auto-delete-schematics: true

  # Restore entities (item frames, armor stands, etc.)
  restore-entities: true

  # Restore biomes (may impact performance)
  restore-biomes: false

  # Capture region state on rental creation
  # If false, only restoration requests will be manual
  auto-capture-on-rent: true

  # Maximum schematic file size (MB) to prevent memory issues
  # Set to -1 for no limit
  max-schematic-size: 50
  
  # Enable multi-page GUI for large storages
  enable-multi-page: true
  
  # GUI title format
  gui-title: 'Retrieved Items - Page {page}/{total}'
  
  # Single page GUI title
  gui-title-single: 'Retrieve Your Items'

# ============================================
# RESTORATION SETTINGS
# ============================================
restoration:
  # Enable block restoration on rental expiry
  enabled: true
  
  # Save region state when rented
  save-on-rent: true
  
  # Restore region state when expired
  restore-on-expire: true
  
  # Blocks to exclude from restoration
  excluded-blocks:
    - BEDROCK
    - COMMAND_BLOCK
    - BARRIER
    - STRUCTURE_BLOCK

# ============================================
# NOTIFICATION SETTINGS
# ============================================
notifications:
  # Enable title notifications
  title-enabled: true
  
  # Enable sound notifications
  sound-enabled: true
  
  # Enable action bar notifications
  actionbar-enabled: false
  
  # Warning times before expiration (in hours)
  warning-times:
    - 72    # 3 days
    - 48    # 2 days
    - 24    # 1 day
    - 12    # 12 hours
    - 6     # 6 hours
    - 3     # 3 hours
    - 1     # 1 hour
  
  # Sound to play for notifications
  notification-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  
  # Sound volume
  sound-volume: 1.0
  
  # Sound pitch
  sound-pitch: 1.0

# ============================================
# MESSAGES
# ============================================
messages:
  # Permission messages
  no-permission: '&cYou don''t have permission to do that!'
  
  # Region messages
  region-not-found: '&cRegion &e{region}&c not found!'
  region-not-setup: '&cRegion &e{region}&c is not set up for rental!'
  invalid-region-format: '&cInvalid format! Console must use world:region format (e.g., world:shop1)'
  region-not-found-in-world: '&cRegion &e{region}&c not found in world &e{world}&c!'
  
  # Rental messages
  already-rented: '&cThis region is already rented!'
  rental-success: '&aYou have successfully rented &e{region}&a for &e{days}&a days!'
  rental-expired: '&cYour rental of &e{region}&c has expired!'
  rental-expiring-soon: '&eYour rental of &6{region}&e expires in &c{time}!'
  not-your-rental: '&cYou don''t own this rental!'
  
  # Economy messages
  not-enough-money: '&cYou don''t have enough money! Need &e{amount}'
  economy-disabled: '&cEconomy features are disabled!'
  refund-given: '&aYou have been refunded &e{amount}&a!'
  
  # Limit messages
  max-rentals-reached: '&cYou have reached the maximum number of rentals! ({current}/{max})'
  cooldown-active: '&cPlease wait &e{seconds}&c seconds before renting again!'
  
  # Extension messages
  rental-extended: '&aRental for &e{region}&a extended for &e{days}&a days!'
  max-extensions-reached: '&cMaximum extensions reached for this rental! ({current}/{max})'
  extension-too-early: '&cYou can only extend rentals within &e{hours}&c hours of expiry!'
  extension-disabled: '&cExtensions are disabled!'
  
  # Duration command messages
  duration-added: '&aAdded &e{time}&a to rental &6{region}'
  duration-removed: '&aRemoved &e{time}&a from rental &6{region}'
  duration-set: '&aSet rental duration for &6{region}&a to &e{time}'
  duration-invalid: '&cInvalid duration format! Example: 2 days 3 hours 30 minutes'
  duration-too-short: '&cDuration would expire the rental immediately!'

  # Duration command refund/charge messages
  duration-add-charged: '&aAdded &e{days}&a days to &e{region}&a. Player &e{player}&a was charged &e{amount}&a.'
  duration-add-free: '&aAdded &e{days}&a to &e{region}&a (no charge).'
  duration-remove-refunded: '&aRemoved &e{days}&a days from &e{region}&a. Player &e{player}&a was refunded &e{amount}&a.'
  duration-remove-no-refund: '&aRemoved &e{days}&a days from &e{region}&a (no refund issued).'

  # Refund tracking messages
  refund-issued: '&aRefund issued to &e{player}&a: &e{amount}&a (Reason: {reason})'
  refund-already-given: '&cCannot refund. Total refunded (&e{refunded}&c) would exceed total paid (&e{paid}&c).'
  refund-history-header: '&a&lRefund History for &e{region}'
  refund-partial: '&aProportional refund for &e{days}&a days removed: &e{amount}'

  # Storage messages
  items-stored: '&aYour &e{count}&a items from &6{region}&a have been stored!'
  items-stored-pages: '&aYour items are stored across &e{pages}&a pages!'
  items-retrieved: '&aYou have retrieved your stored items!'
  no-stored-items: '&cYou have no stored items!'
  storage-expired: '&cYour stored items have expired and been deleted!'
  
  # Sign messages
  sign-created: '&aRental sign created for region &e{region}!'
  sign-removed: '&aRental sign removed!'
  sign-not-rental: '&cThis is not a rental sign!'
  sign-protected: '&cRental signs are protected!'
  sign-support-protected: '&cYou cannot break this block - it supports a rental sign!'

  # Admin messages
  rental-reset: '&aRental for &e{region}&a has been reset!'
  admin-reset-success: '&aSuccessfully reset rental for &e{region}&a. Player &e{player}&a has been refunded &e{amount}&a.'
  rental-reset-refund: '&aYour rental of &e{region}&a has been reset by an admin. You have been refunded &e{amount}&a.'
  region-removed: '&aRegionRental setup completely removed from &e{region}&a:'
  rental-info: '&6=== Rental Info for {region} ==='
  config-reloaded: '&aConfiguration reloaded!'
  aliases-enabled: '&aShort command aliases have been enabled!'
  aliases-disabled: '&eShort aliases disabled due to conflicts. Use /rr prefix.'

  # Member management messages
  member-added: '&aAdded &e{member}&a as a member of &6{region}&a!'
  member-removed: '&aRemoved &e{member}&a from &6{region}&a!'
  member-already-added: '&cPlayer &e{member}&c is already a member!'
  member-not-found: '&cPlayer &e{member}&c is not a member!'
  member-limit-reached: '&cMember limit reached! ({current}/{max})'
  member-management-disabled: '&cMember management is disabled!'
  cannot-add-self: '&cYou cannot add yourself as a member!'
  members-list-header: '&6=== Members of {region} ==='
  members-list-entry: '&e  - {member}'
  members-list-empty: '&7No members added'
  members-list-footer: '&7Total: {count}/{max} members'
  member-added-notify: '&aYou were added as member of &6{region}&a by &e{owner}&a!'
  member-removed-notify: '&cYou were removed from &6{region}&c by &e{owner}&c!'
  not-rental-owner: '&cYou do not own this rental!'

  # Help messages
  help-header: '&6=== RegionRental Help ==='
  help-footer: '&6======================='

# ============================================
# REGIONS CONFIGURATION FILE SETTINGS
# ============================================
regions-config:
  # Automatically verify regions.yml on startup/reload
  # Reports orphaned configs (custom settings without signs)
  auto-verify-regions: true

  # Enable /rrverify command for manual verification
  # Shows which regions use defaults vs custom overrides
  enable-verify-command: true

# ============================================
# PLUGIN INTEGRATIONS
# ============================================
integration:
  # EzChestShop Integration
  ezchestshop:
    # Enable automatic shop removal when rentals expire
    enabled: true

    # Notify player when shops are removed
    notify-on-removal: true

    # Custom message for shop removal (supports {region} placeholder)
    removal-message: '&eChest shops in &6{region}&e have been removed due to rental expiration.'

# ============================================
# PER-REGION CUSTOM OVERRIDES
# ============================================
# IMPORTANT: Use /rroverride commands to set region-specific settings
# Regions NOT in regions.yml will use the default values above
#
# Commands to customize regions:
#   /rroverride price <region> <amount>
#   /rroverride duration <region> <days>
#   /rroverride maxextensions <region> <count>
#   /rroverride extensionprice <region> <amount>
#   /rroverride allowextensions <region> <true|false>
#   /rroverride extensionduration <region> <days>
#   /rroverride list [region]              # View current overrides
#   /rroverride remove <region>            # Remove all overrides
#
# Regions with custom overrides are stored in regions.yml
# Use /rrverify to see which regions use defaults vs custom settings
#
# Migration: Any existing regions: data will be automatically migrated
# to regions.yml on first startup and removed from this file.

# ============================================
# PERMISSION-BASED PRICING
# ============================================
# Give discounts based on permissions
permission-prices:
  # 'regionrental.vip': 50.0      # 50% of normal price
  # 'regionrental.premium': 75.0   # 75% of normal price
  # 'regionrental.special': 25.0   # 25% of normal price

# ============================================
# DEBUG OPTIONS
# ============================================
debug-options:
  # Log rental transactions
  log-rentals: false
  
  # Log expiration checks
  log-expirations: false
  
  # Log extension attempts
  log-extensions: false
  
  # Log storage operations
  log-storage: false
  
  # Log sign updates
  log-signs: false
  
  # Log command usage
  log-commands: false
  
  # Log alias registration
  log-aliases: false

# ============================================
# ADVANCED SETTINGS
# ============================================
advanced:
  # Use async operations where possible
  use-async: true
  
  # Cache rental data
  use-cache: true
  
  # Cache timeout (minutes)
  cache-timeout: 5
  
  # Database settings (future feature)
  database:
    enabled: false
    type: SQLITE  # SQLITE, MYSQL, POSTGRESQL
    host: localhost
    port: 3306
    database: regionrental
    username: root
    password: password
    
# End of configuration
