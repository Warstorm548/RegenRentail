name: RegionRental
version: 2.4.1
main: com.regionrental.RegionRental
api-version: '1.21'
author: Jean-Luc
description: WorldGuard Region Rental System with Clickable Signs
website: https://yourwebsite.com

depend:
  - Vault
  - WorldGuard
  - WorldEdit

softdepend:
  - LuckPerms
  - EzChestShopReborn

commands:
  rr:
    description: RegionRental - Rent WorldGuard regions. Type /rr for help
    usage: /rr
    permission: regionrental.user

# Commands are registered dynamically at runtime with configurable prefix
# Default prefix: 'rr' (can be changed in config.yml)
# Commands will be registered as: /{prefix}info, /{prefix}extend, etc.
# The 'rr' prefix is always kept as a fallback for backward compatibility

permissions:
  regionrental.*:
    description: All RegionRental permissions
    default: op
    children:
      regionrental.admin.*: true
      regionrental.user.*: true
      
  regionrental.admin.*:
    description: All admin permissions
    default: op
    children:
      regionrental.admin.reload: true
      regionrental.admin.createsign: true
      regionrental.admin.reset: true
      regionrental.admin.duration: true
      regionrental.admin.remove: true
      regionrental.admin.refundhistory: true
      regionrental.admin.verify: true
      regionrental.admin.override: true
      regionrental.admin.group: true
      regionrental.admin.bypass: true
      regionrental.admin.breaksign: true
      regionrental.admin.list.others: true
      
  regionrental.user.*:
    description: All user permissions
    default: true
    children:
      regionrental.rent: true
      regionrental.extend: true
      regionrental.retrieve: true
      regionrental.info: true
      regionrental.list: true
      regionrental.member: true
      regionrental.members: true
      regionrental.tp: true

  regionrental.rent:
    description: Rent regions
    default: true
    
  regionrental.extend:
    description: Extend rentals
    default: true
    
  regionrental.retrieve:
    description: Retrieve stored items
    default: true
    
  regionrental.info:
    description: View rental information
    default: true
    
  regionrental.list:
    description: List your rentals
    default: true

  regionrental.member:
    description: Manage members in rented regions
    default: true

  regionrental.members:
    description: View members of rented regions
    default: true

  regionrental.tp:
    description: Teleport to rented regions
    default: true

  regionrental.admin.reload:
    description: Reload the plugin
    default: op
    
  regionrental.admin.createsign:
    description: Create rental signs
    default: op
    
  regionrental.admin.reset:
    description: Reset rentals
    default: op

  regionrental.admin.retime:
    description: (DEPRECATED - use regionrental.admin.duration) Reset rental time
    default: op

  regionrental.admin.duration:
    description: Modify rental duration
    default: op

  regionrental.admin.remove:
    description: Remove RegionRental setup from a region
    default: op

  regionrental.admin.verify:
    description: Verify and repair region configurations
    default: op

  regionrental.admin.override:
    description: Set per-region custom rental settings
    default: op

  regionrental.admin.group:
    description: Manage region groups for bulk overrides
    default: op

  regionrental.admin.refundhistory:
    description: View refund history for rentals
    default: op

  regionrental.user:
    description: Basic user permission for help commands
    default: true

  regionrental.admin.bypass:
    description: Bypass rental restrictions
    default: op
    
  regionrental.admin.breaksign:
    description: Break rental signs
    default: op
    
  regionrental.admin.list.others:
    description: List other players' rentals
    default: op
