name: RegionRental
version: 1.0.0
main: com.regionrental.RegionRental
api-version: '1.21'
author: YourName
description: WorldGuard Region Rental System with Clickable Signs
website: https://yourwebsite.com

depend:
  - Vault
  - WorldGuard
  - WorldEdit

softdepend:
  - LuckPerms

commands:
  rr:
    description: Main RegionRental command
    usage: /rr [help|info|list]
    permission: regionrental.user
    
  rrreload:
    description: Reload the plugin configuration
    usage: /rrreload
    permission: regionrental.admin.reload
    aliases: [reload]
    
  rrcreatesign:
    description: Create a rental sign
    usage: /rrcreatesign <region>
    permission: regionrental.admin.createsign
    aliases: [createsign]
    
  rrreset:
    description: Reset a rental
    usage: /rrreset <region>
    permission: regionrental.admin.reset
    aliases: [reset]

  rrretrieve:
    description: Retrieve stored items
    usage: /rrretrieve
    permission: regionrental.retrieve
    aliases: [retrieve]
    
  rrinfo:
    description: View rental information
    usage: /rrinfo <region>
    permission: regionrental.info
    aliases: [info]
    
  rrlist:
    description: List your rentals
    usage: /rrlist [player]
    permission: regionrental.list
    aliases: [list]
    
  rrextend:
    description: Extend a rental
    usage: /rrextend <region>
    permission: regionrental.extend
    aliases: [extend]
    
  rrduration:
    description: Modify rental duration
    usage: /rrduration <add|remove|set|reset> <region> [<time>]
    permission: regionrental.admin.duration
    aliases: [duration]

  rrremove:
    description: Remove RegionRental setup from a region
    usage: /rrremove <region>
    permission: regionrental.admin.remove
    aliases: [remove]

  rrrefundhistory:
    description: View refund history for a rental region
    usage: /rrrefundhistory <region>
    permission: regionrental.admin.refundhistory
    aliases: [refundhistory]

permissions:
  regionrental.*:
    description: All RegionRental permissions
    default: op
    children:
      regionrental.admin.*: true
      regionrental.user.*: true
      
  regionrental.admin.*:
    description: All admin permissions
    default: op
    children:
      regionrental.admin.reload: true
      regionrental.admin.createsign: true
      regionrental.admin.reset: true
      regionrental.admin.duration: true
      regionrental.admin.remove: true
      regionrental.admin.refundhistory: true
      regionrental.admin.bypass: true
      regionrental.admin.breaksign: true
      regionrental.admin.list.others: true
      
  regionrental.user.*:
    description: All user permissions
    default: true
    children:
      regionrental.rent: true
      regionrental.extend: true
      regionrental.retrieve: true
      regionrental.info: true
      regionrental.list: true
      
  regionrental.rent:
    description: Rent regions
    default: true
    
  regionrental.extend:
    description: Extend rentals
    default: true
    
  regionrental.retrieve:
    description: Retrieve stored items
    default: true
    
  regionrental.info:
    description: View rental information
    default: true
    
  regionrental.list:
    description: List your rentals
    default: true
    
  regionrental.admin.reload:
    description: Reload the plugin
    default: op
    
  regionrental.admin.createsign:
    description: Create rental signs
    default: op
    
  regionrental.admin.reset:
    description: Reset rentals
    default: op

  regionrental.admin.retime:
    description: (DEPRECATED - use regionrental.admin.duration) Reset rental time
    default: op

  regionrental.admin.duration:
    description: Modify rental duration
    default: op

  regionrental.admin.remove:
    description: Remove RegionRental setup from a region
    default: op

  regionrental.admin.bypass:
    description: Bypass rental restrictions
    default: op
    
  regionrental.admin.breaksign:
    description: Break rental signs
    default: op
    
  regionrental.admin.list.others:
    description: List other players' rentals
    default: op
