# RegionRental Configuration
# Complete configuration file for all features

# ============================================
# GENERAL SETTINGS
# ============================================
general:
  # Plugin prefix for all messages
  prefix: '&8[&6RegionRental&8]&r '
  
  # Enable debug mode for troubleshooting
  debug: false
  
  # How often to check for expired rentals (in minutes)
  expiration-check-interval: 1
  
  # Automatic save interval (in minutes)
  auto-save-interval: 5
  
  # Maximum number of pages to show in storage GUI
  max-storage-pages: 10

# ============================================
# COMMAND SETTINGS
# ============================================
commands:
  # Enable short command aliases (only work if no conflicts)
  # If false or conflicts detected, all commands use /rr prefix
  enable-aliases: true
  
  # List of aliases to attempt registering (if no conflicts)
  # Format: shortname: fullcommand
  aliases:
    reload: rrreload
    createsign: rrcreatesign
    reset: rrreset
    retime: rrretime
    retrieve: rrretrieve
    info: rrinfo
    list: rrlist
    extend: rrextend
    duration: rrduration

# ============================================
# ECONOMY SETTINGS
# ============================================
economy:
  # Enable economy features
  enabled: true
  
  # Default rental price
  default-price: 100.0
  
  # Currency format for display
  currency-format: '$%.2f'
  
  # Refund money when admin resets a rental
  refund-on-reset: false
  
  # Refund percentage on early termination (0-100)
  refund-percentage: 0

# ============================================
# DURATION SETTINGS
# ============================================
durations:
  # Default rental duration in days
  default-days: 7
  
  # Available duration options for players
  available-durations:
    - 1
    - 3
    - 7
    - 14
    - 30
  
  # Minimum rental duration (days)
  min-duration: 1
  
  # Maximum rental duration (days)
  max-duration: 90
  
  # Allow custom durations via command
  allow-custom-duration: true
  
  # Time format for duration commands
  # Supports: days, hours, minutes, seconds
  # Short forms: d, h, m, s
  time-format-help: 'Use format: 2 days 3 hours 30 minutes or 2d 3h 30m'

# ============================================
# EXTENSION SETTINGS
# ============================================
extension:
  # Enable rental extensions
  enabled: true
  
  # Default extension duration in days
  extension-days: 7
  
  # Price multiplier for extensions (1.0 = same as rental price)
  price-multiplier: 1.0
  
  # Maximum number of extensions per rental
  max-extensions: 10
  
  # Minimum time before expiry to allow extension (hours)
  min-time-before-extension: 0
  
  # Maximum time before expiry to allow extension (hours)
  # Set to -1 for no limit
  max-time-before-extension: -1

# ============================================
# RENTAL LIMITS
# ============================================
limits:
  # Maximum rentals per player
  max-rentals-per-player: 3
  
  # Override limits by permission
  # Format: permission: limit
  permission-limits:
    'regionrental.vip': 5
    'regionrental.premium': 10
    'regionrental.unlimited': -1
  
  # Cooldown between rentals (seconds)
  rental-cooldown: 0

# ============================================
# SIGN SETTINGS
# ============================================
signs:
  # Format for available signs (4 lines max)
  available-format:
    - '&2[AVAILABLE]'
    - '&6{region}'
    - '&e{price}'
    - '&7{duration} days'
  
  # Format for rented signs (4 lines max)
  rented-format:
    - '&c[RENTED]'
    - '&6{region}'
    - '&e{owner}'
    - '&7Exp: {expires}'
  
  # Format for expiring soon signs
  expiring-format:
    - '&6[EXPIRING]'
    - '&6{region}'
    - '&e{owner}'
    - '&c{hours}h left'
  
  # Protect rental signs from being broken
  protect-signs: true
  
  # Allow breaking signs with permission
  allow-break-with-permission: true
  
  # Update sign interval (seconds)
  update-interval: 30
  
  # Show expiring warning on signs (hours before expiry)
  expiring-threshold: 24

# ============================================
# STORAGE SETTINGS
# ============================================
storage:
  # Enable item storage when rental expires
  enabled: true
  
  # Store items from these container types
  store-from-containers: true
  
  # Container types to scan
  container-types:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - HOPPER
    - DROPPER
    - DISPENSER
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - BREWING_STAND
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
  
  # Maximum storage time before auto-deletion (days)
  # Set to -1 to never delete
  max-storage-time: 30
  
  # Items per page in retrieval GUI
  items-per-page: 45
  
  # Enable multi-page GUI for large storages
  enable-multi-page: true
  
  # GUI title format
  gui-title: 'Retrieved Items - Page {page}/{total}'
  
  # Single page GUI title
  gui-title-single: 'Retrieve Your Items'

# ============================================
# RESTORATION SETTINGS
# ============================================
restoration:
  # Enable block restoration on rental expiry
  enabled: true
  
  # Save region state when rented
  save-on-rent: true
  
  # Restore region state when expired
  restore-on-expire: true
  
  # Blocks to exclude from restoration
  excluded-blocks:
    - BEDROCK
    - COMMAND_BLOCK
    - BARRIER
    - STRUCTURE_BLOCK

# ============================================
# NOTIFICATION SETTINGS
# ============================================
notifications:
  # Enable title notifications
  title-enabled: true
  
  # Enable sound notifications
  sound-enabled: true
  
  # Enable action bar notifications
  actionbar-enabled: false
  
  # Warning times before expiration (in hours)
  warning-times:
    - 72    # 3 days
    - 48    # 2 days
    - 24    # 1 day
    - 12    # 12 hours
    - 6     # 6 hours
    - 3     # 3 hours
    - 1     # 1 hour
  
  # Sound to play for notifications
  notification-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  
  # Sound volume
  sound-volume: 1.0
  
  # Sound pitch
  sound-pitch: 1.0

# ============================================
# MESSAGES
# ============================================
messages:
  # Permission messages
  no-permission: '&cYou don''t have permission to do that!'
  
  # Region messages
  region-not-found: '&cRegion &e{region}&c not found!'
  region-not-setup: '&cRegion &e{region}&c is not set up for rental!'
  
  # Rental messages
  already-rented: '&cThis region is already rented!'
  rental-success: '&aYou have successfully rented &e{region}&a for &e{days}&a days!'
  rental-expired: '&cYour rental of &e{region}&c has expired!'
  rental-expiring-soon: '&eYour rental of &6{region}&e expires in &c{time}!'
  not-your-rental: '&cYou don''t own this rental!'
  
  # Economy messages
  not-enough-money: '&cYou don''t have enough money! Need &e{amount}'
  economy-disabled: '&cEconomy features are disabled!'
  refund-given: '&aYou have been refunded &e{amount}&a!'
  
  # Limit messages
  max-rentals-reached: '&cYou have reached the maximum number of rentals! ({current}/{max})'
  cooldown-active: '&cPlease wait &e{seconds}&c seconds before renting again!'
  
  # Extension messages
  rental-extended: '&aRental for &e{region}&a extended for &e{days}&a days!'
  max-extensions-reached: '&cMaximum extensions reached for this rental! ({current}/{max})'
  extension-too-early: '&cYou can only extend rentals within &e{hours}&c hours of expiry!'
  extension-disabled: '&cExtensions are disabled!'
  
  # Duration command messages
  duration-added: '&aAdded &e{time}&a to rental &6{region}'
  duration-removed: '&aRemoved &e{time}&a from rental &6{region}'
  duration-set: '&aSet rental duration for &6{region}&a to &e{time}'
  duration-invalid: '&cInvalid duration format! Example: 2 days 3 hours 30 minutes'
  duration-too-short: '&cDuration would expire the rental immediately!'
  
  # Storage messages
  items-stored: '&aYour &e{count}&a items from &6{region}&a have been stored!'
  items-stored-pages: '&aYour items are stored across &e{pages}&a pages!'
  items-retrieved: '&aYou have retrieved your stored items!'
  no-stored-items: '&cYou have no stored items!'
  storage-expired: '&cYour stored items have expired and been deleted!'
  
  # Sign messages
  sign-created: '&aRental sign created for region &e{region}!'
  sign-removed: '&aRental sign removed!'
  sign-not-rental: '&cThis is not a rental sign!'
  sign-protected: '&cRental signs are protected!'
  
  # Admin messages
  rental-reset: '&aRental for &e{region}&a has been reset!'
  rental-info: '&6=== Rental Info for {region} ==='
  config-reloaded: '&aConfiguration reloaded!'
  aliases-enabled: '&aShort command aliases have been enabled!'
  aliases-disabled: '&eShort aliases disabled due to conflicts. Use /rr prefix.'
  
  # Help messages
  help-header: '&6=== RegionRental Help ==='
  help-footer: '&6======================='

# ============================================
# PER-REGION SETTINGS
# ============================================
# Override default settings for specific regions
regions:
  # Example configuration for a specific region
  # shop1:
  #   price: 500.0
  #   duration: 14
  #   max-extensions: 20
  #   extension-price: 250.0
  #   allow-extensions: true

# ============================================
# PERMISSION-BASED PRICING
# ============================================
# Give discounts based on permissions
permission-prices:
  # 'regionrental.vip': 50.0      # 50% of normal price
  # 'regionrental.premium': 75.0   # 75% of normal price
  # 'regionrental.special': 25.0   # 25% of normal price

# ============================================
# DEBUG OPTIONS
# ============================================
debug-options:
  # Log rental transactions
  log-rentals: false
  
  # Log expiration checks
  log-expirations: false
  
  # Log extension attempts
  log-extensions: false
  
  # Log storage operations
  log-storage: false
  
  # Log sign updates
  log-signs: false
  
  # Log command usage
  log-commands: false
  
  # Log alias registration
  log-aliases: false

# ============================================
# ADVANCED SETTINGS
# ============================================
advanced:
  # Use async operations where possible
  use-async: true
  
  # Cache rental data
  use-cache: true
  
  # Cache timeout (minutes)
  cache-timeout: 5
  
  # Database settings (future feature)
  database:
    enabled: false
    type: SQLITE  # SQLITE, MYSQL, POSTGRESQL
    host: localhost
    port: 3306
    database: regionrental
    username: root
    password: password
    
# End of configuration
