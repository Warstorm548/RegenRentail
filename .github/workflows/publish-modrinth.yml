name: Publish to Modrinth

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle 9.2.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.2.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Extract version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Publish to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: iNHRLu42
        modrinth-token: ${{ secrets.MODRINTHAPI }}

        files: build/libs/RegionRental-*.jar

        name: RegionRental v${{ steps.version.outputs.version }}
        version: ${{ steps.version.outputs.version }}
        version-type: alpha

        loaders: |
          paper
          spigot
          bukkit
          purpur

        game-versions: |
          1.21.x

        changelog-file: CHANGELOG.md
