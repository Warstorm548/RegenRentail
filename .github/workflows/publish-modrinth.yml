name: Publish to Modrinth

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle 9.2.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.2.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Extract version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Extract changelog for current version
      id: changelog
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        echo "Extracting changelog for version $VERSION"

        # Extract section between ## [VERSION] and next ---
        CHANGELOG=$(sed -n "/^## \[$VERSION\]/,/^---$/p" CHANGELOG.md | sed '1d;$d')

        # Write to file for mc-publish
        echo "$CHANGELOG" > RELEASE_NOTES.md
        echo "Extracted changelog:"
        cat RELEASE_NOTES.md

    - name: Publish to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: iNHRLu42
        modrinth-token: ${{ secrets.MODRINTHAPI }}

        files: build/libs/ZoneRental-*.jar

        name: ZoneRental v${{ steps.version.outputs.version }}
        version: ${{ steps.version.outputs.version }}
        version-type: alpha

        loaders: |
          paper
          spigot
          bukkit
          purpur

        game-versions: |
          1.21.x

        changelog-file: RELEASE_NOTES.md

    - name: Update dependencies via Modrinth API
      run: |
        # Wait a moment for Modrinth to process the upload
        sleep 5

        # Get the version ID that was just created
        VERSION_ID=$(curl -s -H "Authorization: ${{ secrets.MODRINTHAPI }}" \
          "https://api.modrinth.com/v2/project/iNHRLu42/version" | \
          jq -r '.[0].id')

        echo "Patching version: $VERSION_ID"

        # Patch with correct dependencies including version IDs
        curl -X PATCH \
          -H "Authorization: ${{ secrets.MODRINTHAPI }}" \
          -H "Content-Type: application/json" \
          -d '{
            "dependencies": [
              {"project_id": "DKY9btbd", "version_id": "PO4MKx7e", "dependency_type": "required"},
              {"project_id": "1u6JkXh5", "version_id": "Jk1z2u7n", "dependency_type": "required"},
              {"project_id": "hXiIvTyT", "dependency_type": "optional"},
              {"project_id": "Vebnzrzj", "dependency_type": "optional"}
            ]
          }' \
          "https://api.modrinth.com/v2/version/$VERSION_ID"

        echo "Dependencies updated successfully"
