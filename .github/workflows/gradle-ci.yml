name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle 9.2.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.2.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Run tests
      run: ./gradlew test
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: RegionRental-JAR
        path: build/libs/*.jar
        retention-days: 30

    - name: Build summary
      if: always()
      run: |
        echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version:** OpenJDK 21" >> $GITHUB_STEP_SUMMARY
        echo "- **Gradle Version:** 9.2.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        if [ -f build/libs/*.jar ]; then
          echo "- **Artifacts:** Built successfully" >> $GITHUB_STEP_SUMMARY
        fi
